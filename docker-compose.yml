services:
  web:
    build: .
    container_name: demo-page
    ports:
      - '1235:1235'
    command: npm run demo
  e2e:
    build: ./puppeteer
    container_name: puppeteer
    network_mode: 'host'
    depends_on:
      - web
    environment:
      - DEMO_URL=http://localhost:1235/demo
      - DISPLAY=:99
      - USER_A
      - USER_B
      - USER_C
      - PASSWORD_A
      - PASSWORD_B
      - PASSWORD_C
      - NUMBER_A
      - NUMBER_B
      - NUMBER_C
      - WEBSOCKET_URL
      - REALM
